<mat-sidenav-container class="admin-container">
  <mat-sidenav mode="side" opened class="admin-sidenav">
    <mat-toolbar color="primary">Panel Admin</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/admin/products" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Productos</span>
      </a>
      <a mat-list-item routerLink="/admin/orders" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Pedidos</span>
      </a>
      <a mat-list-item routerLink="/admin/categories" routerLinkActive="active-link">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Categorías</span>
      </a>
      <a mat-list-item routerLink="/admin/contacts" routerLinkActive="active-link">
        <mat-icon matListItemIcon>mail</mat-icon>
        <span matListItemTitle>Mensajes</span>
      </a>
    </mat-nav-list>
    <div class="sidenav-footer">
      <a mat-list-item routerLink="/">
        <mat-icon matListItemIcon>storefront</mat-icon>
        <span matListItemTitle>Ir a la tienda</span>
      </a>
      <button mat-list-item (click)="logout()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Cerrar sesión</span>
      </button>
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="admin-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
