<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>📝 Crear Cuenta</mat-card-title>
      <mat-card-subtitle>Únete a nuestra comunidad</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre completo</mat-label>
          <input matInput type="text" [(ngModel)]="name" name="name" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar contraseña</mat-label>
          <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width">
          Crear Cuenta
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
    </mat-card-actions>
  </mat-card>
</div>
